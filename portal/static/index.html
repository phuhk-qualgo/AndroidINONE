<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AndroidINONE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app">
    <header class="topbar">
        <div class="topbar-brand">&#9888;&#65039; AndroidINONE</div>
        <div class="topbar-status">
            <span class="status-badge"><span class="status-dot" id="dev-dot"></span><span id="dev-lbl">No device</span></span>
            <span class="status-badge"><span class="status-dot" id="fri-dot"></span>Frida</span>
            <span class="status-badge notif-badge" onclick="toggleNotif()">&#128276;<span class="badge-count" id="nc" style="display:none">0</span></span>
        </div>
    </header>
    <nav class="sidebar" id="sidebar">
        <button class="nav-item active" data-page="dashboard">&#9670; Dashboard</button>
        <div class="nav-sep">ASSESSMENT</div>
        <button class="nav-item" data-page="target">&#128269; Target</button>
        <button class="nav-item" data-page="semgrep">&#128220; Semgrep</button>
        <button class="nav-item" data-page="drozer">&#128737; Drozer</button>
        <button class="nav-item" data-page="hunter">&#127919; Hunter</button>
        <div class="nav-sep">DYNAMIC</div>
        <button class="nav-item" data-page="frida">&#128296; Frida</button>
        <button class="nav-item" data-page="objection">&#128274; Objection</button>
        <button class="nav-item" data-page="medusa">&#128025; Medusa</button>
        <button class="nav-item" data-page="memory">&#128190; Memory</button>
        <button class="nav-item" data-page="traffic">&#128279; Traffic</button>
        <div class="nav-sep">UTILITY</div>
        <button class="nav-item" data-page="shell">&#9002; Shell</button>
        <button class="nav-item" data-page="reports">&#128203; Reports</button>
    </nav>
    <main class="main-content" id="mc"></main>
</div>
<div id="notif-panel" class="notif-panel" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <strong>Notifications</strong><button class="btn btn-sm" onclick="notifs=[];renderNotif();$('nc').style.display='none'">Clear</button>
    </div>
    <div id="notif-list"></div>
</div>
<div id="modal-overlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modal-body"></div>
</div>
<div id="toasts" class="toast-container"></div>
<script src="/static/js/app.js"></script>
</body>
</html>
